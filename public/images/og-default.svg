<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ogbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F2537" />
    </linearGradient>
    <linearGradient id="ogaccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0" />
    </linearGradient>
    <pattern id="oggrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E40AF" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)" />
  <rect width="1200" height="630" fill="url(#oggrid)" />

  <g opacity="0.4">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#1E40AF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#1E40AF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="630" stroke="#1E40AF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="630" stroke="#1E40AF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="630" stroke="#1E40AF" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="#1E40AF" />
    <path d="M 18 18 L 62 18 L 62 28 L 30 28 L 30 36 L 56 36 L 56 46 L 30 46 L 30 62 L 18 62 Z" fill="#FFFFFF" />
    <circle cx="58" cy="22" r="3" fill="#3B82F6" />
    <text x="100" y="48" font-family="-apple-system, system-ui, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">AXENTRA</text>
    <text x="100" y="74" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8C9BA5" letter-spacing="3">CARGO</text>
  </g>

  <g transform="translate(80, 220)">
    <text font-family="-apple-system, system-ui, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Comanda tu carga.</text>
    <text y="100" font-family="-apple-system, system-ui, sans-serif" font-size="78" font-weight="800" fill="#3B82F6" letter-spacing="-2">Rutas que mandan.</text>
  </g>

  <text x="80" y="500" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">Transporte multimodal · Cruce fronterizo · Carga especializada</text>

  <g transform="translate(80, 550)">
    <rect width="180" height="8" rx="2" fill="url(#ogaccent)" />
    <text x="200" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">axentracargo.com</text>
  </g>

  <g transform="translate(800, 200)" opacity="0.5">
    <path d="M 0 200 Q 50 170 80 120 T 150 70 Q 180 40 220 55 T 320 90" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="0" cy="200" r="5" fill="#3B82F6" />
    <circle cx="150" cy="70" r="5" fill="#3B82F6" />
    <circle cx="320" cy="90" r="5" fill="#3B82F6" />
  </g>
</svg>