<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mapa de rutas logísticas Axentra Cargo México-Estados Unidos">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F2537" />
    </linearGradient>
    <linearGradient id="route" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1E40AF" stop-opacity="1" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E40AF" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <g stroke="#1E40AF" stroke-opacity="0.3" stroke-width="1" fill="none">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <path
    d="M 200 380 Q 250 350 280 300 T 350 250 Q 380 220 400 180 T 480 150 Q 520 130 560 145 T 650 180"
    stroke="url(#route)"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
  />

  <path
    d="M 200 380 Q 230 410 270 420 T 340 410 Q 360 405 380 395"
    stroke="url(#route)"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-dasharray="4 4"
    opacity="0.7"
  />

  <g>
    <circle cx="200" cy="380" r="8" fill="#1E40AF" />
    <circle cx="200" cy="380" r="14" fill="none" stroke="#1E40AF" stroke-opacity="0.4" stroke-width="2" />
    <text x="215" y="385" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="600">CDMX</text>
  </g>

  <g>
    <circle cx="380" cy="220" r="6" fill="#1E40AF" />
    <text x="395" y="225" fill="#CBD5E1" font-family="system-ui" font-size="11">Monterrey</text>
  </g>

  <g>
    <circle cx="480" cy="150" r="6" fill="#1E40AF" />
    <text x="495" y="155" fill="#CBD5E1" font-family="system-ui" font-size="11">Laredo</text>
  </g>

  <g>
    <circle cx="650" cy="180" r="8" fill="#1E40AF" />
    <circle cx="650" cy="180" r="14" fill="none" stroke="#1E40AF" stroke-opacity="0.4" stroke-width="2" />
    <text x="665" y="185" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="600">Houston</text>
  </g>

  <g>
    <rect x="40" y="40" width="220" height="60" rx="6" fill="#0F2537" stroke="#1E40AF" stroke-opacity="0.3" />
    <text x="55" y="62" fill="#CBD5E1" font-family="system-ui" font-size="10" font-weight="500">ESTADO DE FLOTA</text>
    <text x="55" y="85" fill="#FFFFFF" font-family="system-ui" font-size="20" font-weight="700">12 activas</text>
  </g>

  <g>
    <rect x="600" y="40" width="160" height="40" rx="4" fill="#1E40AF" fill-opacity="0.15" stroke="#1E40AF" stroke-opacity="0.5" />
    <circle cx="615" cy="60" r="4" fill="#10B981" />
    <text x="628" y="64" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="600">RUTA PARAMETRIZADA</text>
  </g>

  <g>
    <rect x="600" y="440" width="160" height="40" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5" />
    <circle cx="615" cy="460" r="4" fill="#10B981" />
    <text x="628" y="464" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="600">UNIDAD EN REGLA</text>
  </g>
</svg>