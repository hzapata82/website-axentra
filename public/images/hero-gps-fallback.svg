<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mapa de rutas logísticas Axentra Cargo México-Estados Unidos">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F2537" />
    </linearGradient>
    <linearGradient id="route-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="route-secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E40AF" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <g stroke="#1E40AF" stroke-opacity="0.25" stroke-width="1" fill="none">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <g fill="none" stroke="#1E40AF" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 3">
    <path d="M 80 100 Q 150 200 200 380" />
    <path d="M 380 220 Q 500 180 560 145" />
    <path d="M 650 180 Q 720 240 740 350" />
    <path d="M 200 380 Q 300 420 380 410" />
  </g>

  <path
    d="M 200 380 Q 250 350 280 300 T 350 250 Q 380 220 400 180 T 480 150 Q 520 130 560 145 T 650 180"
    stroke="url(#route-primary)"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
  />

  <path
    d="M 200 380 Q 230 410 270 420 T 340 410 Q 360 405 380 395"
    stroke="url(#route-secondary)"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-dasharray="5 4"
  />

  <path
    d="M 560 145 Q 600 160 620 175 L 650 180"
    stroke="url(#route-secondary)"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-dasharray="5 4"
  />

  <g>
    <circle cx="200" cy="380" r="32" fill="url(#hub-glow)" />
    <circle cx="200" cy="380" r="9" fill="#3B82F6" />
    <circle cx="200" cy="380" r="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
    <text x="215" y="385" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="700">CDMX</text>
    <text x="215" y="400" fill="#94A3B8" font-family="system-ui" font-size="10">Hub principal</text>
  </g>

  <g>
    <circle cx="380" cy="220" r="6" fill="#3B82F6" />
    <circle cx="380" cy="220" r="12" fill="none" stroke="#3B82F6" stroke-opacity="0.3" />
    <text x="395" y="225" fill="#E2E8F0" font-family="system-ui" font-size="11" font-weight="500">Monterrey</text>
  </g>

  <g>
    <circle cx="480" cy="150" r="6" fill="#3B82F6" />
    <circle cx="480" cy="150" r="12" fill="none" stroke="#3B82F6" stroke-opacity="0.3" />
    <text x="495" y="155" fill="#E2E8F0" font-family="system-ui" font-size="11" font-weight="500">Laredo</text>
    <text x="495" y="168" fill="#64748B" font-family="system-ui" font-size="9">Cruce fronterizo</text>
  </g>

  <g>
    <circle cx="650" cy="180" r="32" fill="url(#hub-glow)" />
    <circle cx="650" cy="180" r="9" fill="#3B82F6" />
    <circle cx="650" cy="180" r="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
    <text x="665" y="185" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="700">Houston</text>
    <text x="665" y="200" fill="#94A3B8" font-family="system-ui" font-size="10">Hub destino</text>
  </g>

  <g transform="translate(30, 30)">
    <rect width="240" height="80" rx="8" fill="#0F2537" stroke="#1E40AF" stroke-opacity="0.4" />
    <text x="16" y="24" fill="#94A3B8" font-family="system-ui" font-size="9" font-weight="600" letter-spacing="1.5">ESTADO DE FLOTA</text>
    <text x="16" y="52" fill="#FFFFFF" font-family="system-ui" font-size="22" font-weight="800">12 activas</text>
    <g transform="translate(16, 60)">
      <circle cx="4" cy="4" r="3" fill="#10B981" />
      <text x="14" y="8" fill="#94A3B8" font-family="system-ui" font-size="9">9 en ruta</text>
      <circle cx="74" cy="4" r="3" fill="#F59E0B" />
      <text x="84" y="8" fill="#94A3B8" font-family="system-ui" font-size="9">2 en cruce</text>
      <circle cx="148" cy="4" r="3" fill="#3B82F6" />
      <text x="158" y="8" fill="#94A3B8" font-family="system-ui" font-size="9">1 en patio</text>
    </g>
  </g>

  <g transform="translate(560, 30)">
    <rect width="210" height="36" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="18" r="5" fill="#10B981" />
    <circle cx="18" cy="18" r="9" fill="none" stroke="#10B981" stroke-opacity="0.3" />
    <text x="32" y="22" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="600" letter-spacing="0.5">RUTA PARAMETRIZADA</text>
  </g>

  <g transform="translate(30, 420)">
    <rect width="220" height="60" rx="8" fill="#0F2537" stroke="#1E40AF" stroke-opacity="0.3" />
    <text x="16" y="22" fill="#94A3B8" font-family="system-ui" font-size="9" font-weight="600" letter-spacing="1.5">ETA · UNIDAD 247</text>
    <text x="16" y="44" fill="#FFFFFF" font-family="system-ui" font-size="14" font-weight="700">14:32 hrs</text>
    <text x="100" y="44" fill="#10B981" font-family="system-ui" font-size="11" font-weight="500">+8 min</text>
  </g>

  <g transform="translate(560, 430)">
    <rect width="210" height="50" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="22" cy="25" r="6" fill="#3B82F6" />
    <circle cx="22" cy="25" r="10" fill="none" stroke="#3B82F6" stroke-opacity="0.3" />
    <text x="40" y="22" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="600" letter-spacing="0.5">UNIDAD EN REGLA</text>
    <text x="40" y="38" fill="#94A3B8" font-family="system-ui" font-size="9">GPS espejo activo</text>
  </g>
</svg>